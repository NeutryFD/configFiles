# sshuttle tunnel, started with: vpn up <client>/<file name without .conf>

# remote: ssh host alias from ~/.ssh/config
remote=example-bastion

# subnets: space-separated networks routed through the remote
subnets="10.0.0.0/24 172.16.0.0/16"

# exclude: space-separated networks or hosts never routed (sshuttle -x)
exclude="10.0.0.1"

# dns: on | off, also tunnel DNS queries (sshuttle --dns)
dns=off

# auto_nets: yes | no, add the routes the remote announces (sshuttle -N)
auto_nets=no

# needs_vpn: yes | no, bring the client VPN up first unless the remote already routes through one
# (default: yes when the client has a vpn.conf)
needs_vpn=yes

# args: optional extra sshuttle arguments, split on spaces with no shell expansion
args=
