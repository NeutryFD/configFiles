# VPN of this client; leave the file out for clients that only have tunnels

# type: openfortivpn | openvpn
type=openfortivpn

# config: path relative to the client dir (or absolute); keep it in secrets/ (dir 700, file 600)
# openvpn runs with --cd <dir of config>, so relative ca/cert/key paths inside the .ovpn work
config=secrets/example.vpn

# args: optional extra arguments, split on spaces with no shell expansion
args=
