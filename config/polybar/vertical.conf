; Vertical left bar shared by the <host>-vertical.conf files
; The including file must define bar/base and modules date, xkeyboard, banner and spotify

; =============================================================================
; BASE BAR CONFIG — VERTICAL LEFT BAR
; =============================================================================
; polybar resolves inherit in alphabetical order: base sections must sort first
[bar/base-vbar]
inherit = bar/base
; struts would reserve space at the top; bspwmrc sets left_padding instead
enable-struts = false
monitor = ${env:MONITOR:}
width = 60
height = 30
offset-x = 8
padding-left = 0
padding-right = 0
module-margin-left = 0
module-margin-right = 0
border-top-size = 0
border-bottom-size = 0
radius = 0
scroll-up = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --prev
scroll-down = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --next
; the whole bar scrolls, so keep the normal cursor instead of ns-resize
cursor-scroll = left_ptr
font-5 = Hack Nerd Font Propo:style=Bold:pixelsize=21;5
font-6 = Hack Nerd Font Propo:style=Regular:pixelsize=14;3
font-7 = Hack Nerd Font Propo:style=Regular:pixelsize=16;4
font-8 = Droid Sans:style=Regular:pixelsize=15;4
font-9 = fixed:pixelsize=10;3
font-10 = fixed:pixelsize=10;2
; fixed lacks box drawing
font-11 = Hack Nerd Font Propo:style=Regular:pixelsize=10;3

; =============================================================================
; BAR DEFINITIONS — VERTICAL LEFT BAR (top to bottom)
; =============================================================================
[bar/vbar-top]
inherit = bar/base-vbar
offset-y = 4
height = 10
radius-top = 10
modules-center = vbar-filler

[bar/vbar-kbd]
inherit = bar/base-vbar
offset-y = 14
height = 22
modules-center = xkeyboard-compact

[bar/vbar-disk]
inherit = bar/base-vbar
offset-y = 36
height = 22
modules-center = disk-compact

; VBAR_Y/VBAR_HEIGHT are set by launch_left_bar to centre fewer desktop slots
[bar/vbar-upper]
inherit = bar/base-vbar
offset-y = 58
height = ${env:VBAR_HEIGHT:50%:-208}
modules-center = vbar-filler

[bar/vbar-1]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:-150}
modules-center = bspwm-desk-1

[bar/vbar-2]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:-120}
modules-center = bspwm-desk-2

[bar/vbar-3]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:-90}
modules-center = bspwm-desk-3

[bar/vbar-4]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:-60}
modules-center = bspwm-desk-4

[bar/vbar-5]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:-30}
modules-center = bspwm-desk-5

[bar/vbar-6]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:+0}
modules-center = bspwm-desk-6

[bar/vbar-7]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:+30}
modules-center = bspwm-desk-7

[bar/vbar-8]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:+60}
modules-center = bspwm-desk-8

[bar/vbar-9]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:+90}
modules-center = bspwm-desk-9

[bar/vbar-10]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:+120}
modules-center = bspwm-desk-10

[bar/vbar-gap]
inherit = bar/base-vbar
offset-y = ${env:VBAR_Y:50%:+150}
height = ${env:VBAR_HEIGHT:50%:-288}
modules-center = vbar-filler

[bar/vbar-hour]
inherit = bar/base-vbar
offset-y = 100%:-138
height = 24
modules-center = clock-hour

[bar/vbar-min]
inherit = bar/base-vbar
offset-y = 100%:-114
height = 24
modules-center = clock-minute

[bar/vbar-sep]
inherit = bar/base-vbar
offset-y = 100%:-90
height = 14
modules-center = clock-divider

[bar/vbar-day]
inherit = bar/base-vbar
offset-y = 100%:-76
height = 24
modules-center = clock-mday

[bar/vbar-month]
inherit = bar/base-vbar
offset-y = 100%:-52
height = 24
modules-center = clock-month

[bar/vbar-bottom]
inherit = bar/base-vbar
offset-y = 100%:-28
height = 24
radius-bottom = 10
modules-center = vbar-filler

; =============================================================================
; MODULES
; =============================================================================
[module/bspwm-desk]
type = custom/script
tail = true

[module/bspwm-desk-1]
inherit = module/bspwm-desk
exec = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --follow 1
click-left = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --focus 1

[module/bspwm-desk-2]
inherit = module/bspwm-desk
exec = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --follow 2
click-left = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --focus 2

[module/bspwm-desk-3]
inherit = module/bspwm-desk
exec = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --follow 3
click-left = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --focus 3

[module/bspwm-desk-4]
inherit = module/bspwm-desk
exec = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --follow 4
click-left = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --focus 4

[module/bspwm-desk-5]
inherit = module/bspwm-desk
exec = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --follow 5
click-left = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --focus 5

[module/bspwm-desk-6]
inherit = module/bspwm-desk
exec = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --follow 6
click-left = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --focus 6

[module/bspwm-desk-7]
inherit = module/bspwm-desk
exec = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --follow 7
click-left = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --focus 7

[module/bspwm-desk-8]
inherit = module/bspwm-desk
exec = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --follow 8
click-left = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --focus 8

[module/bspwm-desk-9]
inherit = module/bspwm-desk
exec = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --follow 9
click-left = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --focus 9

[module/bspwm-desk-10]
inherit = module/bspwm-desk
exec = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --follow 10
click-left = $HOME/.config/polybar/scripts/bspwm_desktops_daemon.sh --focus 10

[module/vbar-filler]
type = custom/text
format = " "

[module/clock-hour]
inherit = module/date
format-padding = 0
format-foreground = ${colors.foreground}
date =
time = "%H"
label = %time%
label-font = 9

[module/disk-compact]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %mountpoint% %percentage_used%%
label-mounted-font = 10
label-unmounted = %mountpoint% --
label-unmounted-font = 10

[module/xkeyboard-compact]
inherit = module/xkeyboard
label-layout-font = 11

[module/clock-minute]
inherit = module/clock-hour
time = "%M"

[module/clock-mday]
; must sort after clock-hour (inherit order)
inherit = module/clock-hour
time = "%d"
format-foreground = ${colors.accent}

[module/clock-month]
inherit = module/clock-hour
time = "%m"
format-foreground = ${colors.accent}

[module/clock-divider]
type = custom/text
format = "%{T12}──%{T-}"
format-foreground = ${colors.muted}

[module/banner-mono]
inherit = module/banner
label-padding = 0
label-font = 6

[module/spotify-fit]
inherit = module/spotify
; scrolls only titles longer than label-maxlen
exec = $HOME/.config/polybar/scripts/spotify_status.sh --fit 32
label-maxlen = 32
label-ellipsis = false
label-font = 6

[module/volume-compact]
type = internal/pulseaudio
format-volume = <label-volume>
; the icon overhangs its advance
label-volume = 󰕾%{O6}%percentage%
label-muted = 󰖁
label-muted-foreground = ${colors.foreground-alt}

; vim:ft=dosini
