## --- General Config --------------------
backend = "glx";
vsync = true;
glx-copy-from-front = false;
glx-swap-method = 2;
shadow-exclude = ["name = 'polybar'"];

##  --- Opacity --------------------------
active-opacity = 1;
inactive-opacity = 0.9;
frame-opacity = 1;
inactive-opacity-override = false;
blur-background = true;

##  --- Borders ---------------------
corner-radius = 8;	
# Vertical polybar desktop slots are stacked windows that must read as one bar;
# polybar rounds the column ends itself (radius-top/radius-bottom)
rounded-corners-exclude = ["name ^= 'polybar-v-desk-'"];
# per-window blur leaves a 1px darker row at the top edge of every slot
blur-background-exclude = ["name ^= 'polybar-v-desk-'"];

#blur-method = "dual_kawase";
#blur-strength = 6;

##  --- Fading --------------------------
fading = true;
fade-delta = 4;
no-fading-openclose = false;
fade-exclude = [ ];

##  -- Window type settings -------------
wintypes:
{
		dock = {
				shadow = false;
				};
};

##  --- Opacity Rules -------------------
opacity-rule = [
	"95:class_g = 'Rofi'",
	"100:class_g = 'i3lock'",
	"100:class_g = 'Gimp'"
];

xrender-sync-fence = false;
