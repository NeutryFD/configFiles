; Colors, base bar, modules and settings: arch-common.conf
include-file = arch-common.conf

; =============================================================================
; BAR DEFINITIONS
; =============================================================================
[bar/left]
inherit = bar/base
width = 12%
offset-x = 0.5%
modules-left = xkeyboard filesystem

[bar/banner]
inherit = bar/base
width = 15%
offset-x = 12.5%
modules-center = banner

[bar/vpn]
inherit = bar/base
width = 10%
offset-x = 81.5%
bottom = true
modules-center = vpn

[bar/ethernet]
inherit = bar/base
width = 8%
offset-x = 91.5%
bottom = true
modules-center = eth

[bar/bspwm]
inherit = bar/base
width = 15%
offset-x = 41.5%
modules-center = bspwm

[bar/music]
inherit = bar/base
width = 7%
offset-x = 61.7%
modules-center = spotify

[bar/right]
inherit = bar/base
width = 31%
offset-x = 68.5%
modules-center = spotify-prev spotify-play-pause spotify-next volume memory system-nvidia-smi cpu temperature date

[bar/tray]
inherit = bar/base
width = 20%
offset-x = 0.5%
bottom = true
modules-left = tray
tray-position = right

[bar/gearbox]
inherit = bar/base
width = 4%
offset-x = 77%
bottom = true
modules-center = mm712-battery
; T6: small icon, T7: bold percentage (used by mm712_battery.sh)
font-5 = Hack Nerd Font:style=Regular:pixelsize=9;1
font-6 = Hack Nerd Font:style=Bold:pixelsize=9;1

; vim:ft=dosini
