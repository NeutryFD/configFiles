; Vertical layout: a column of narrow pills on the left edge.
; Selected by bspwmrc when ~/.cache/bar-layout contains "vertical".

; Colors, base bar, modules and settings: arch-common.conf
include-file = arch-common.conf

; =============================================================================
; BASE BAR CONFIG — VERTICAL DESKTOP COLUMN
; =============================================================================
; The column is one borderless 53px cell per desktop, 60px wide at x=8,
; stacked with no gap and centered on 50% so it reads as a single pill.
; Only v-desk-1 rounds the top corners; bspwmrc launches the last slot with
; DESK_RADIUS_BOTTOM=6 to round the bottom ones. bspwmrc sets left_padding to
; 8 + 60 + 8 = 76.
; Icons come from bspwm_desktops_daemon.sh (one bspc subscriber for all slots)
; and use the large icon font T6 (font-5) defined here. Propo: Hack Nerd Font
; draws these icons wider than their advance, so polybar clips them.
; Polybar resolves inherit in alphabetical section order, so the base section
; must sort before the bars inheriting it.
[bar/base-vertical-desk]
inherit = bar/base
; left-edge bars must not reserve space at the top; bspwmrc sets left_padding
enable-struts = false
width = 60
height = 53
offset-x = 8
padding-left = 0
padding-right = 0
module-margin-left = 0
module-margin-right = 0
border-top-size = 0
border-bottom-size = 0
radius = 0
radius-bottom = ${env:DESK_RADIUS_BOTTOM:0}
font-5 = Hack Nerd Font Propo:style=Bold:pixelsize=22;5

; =============================================================================
; BAR DEFINITIONS — VERTICAL DESKTOP COLUMN (top to bottom)
; =============================================================================
[bar/vdate]
; time pill right above the desktop column: column top is y=275 (50%-265, no
; top border); window bottom at 271 leaves 8px visible gap like other pills
inherit = bar/base
width = 60
offset-x = 8
offset-y = 50%:-307
modules-center = date-compact

[bar/v-desk-1]
inherit = bar/base-vertical-desk
offset-y = 50%:-265
radius-top = 6
modules-center = bspwm-desk-1

[bar/v-desk-2]
inherit = bar/base-vertical-desk
offset-y = 50%:-212
modules-center = bspwm-desk-2

[bar/v-desk-3]
inherit = bar/base-vertical-desk
offset-y = 50%:-159
modules-center = bspwm-desk-3

[bar/v-desk-4]
inherit = bar/base-vertical-desk
offset-y = 50%:-106
modules-center = bspwm-desk-4

[bar/v-desk-5]
inherit = bar/base-vertical-desk
offset-y = 50%:-53
modules-center = bspwm-desk-5

[bar/v-desk-6]
inherit = bar/base-vertical-desk
offset-y = 50%:0
modules-center = bspwm-desk-6

[bar/v-desk-7]
inherit = bar/base-vertical-desk
offset-y = 50%:53
modules-center = bspwm-desk-7

[bar/v-desk-8]
inherit = bar/base-vertical-desk
offset-y = 50%:106
modules-center = bspwm-desk-8

[bar/v-desk-9]
inherit = bar/base-vertical-desk
offset-y = 50%:159
modules-center = bspwm-desk-9

[bar/v-desk-10]
inherit = bar/base-vertical-desk
offset-y = 50%:212
modules-center = bspwm-desk-10

; =============================================================================
; BAR DEFINITIONS — HORIZONTAL CORNER PILLS (same look and struts as arch.conf)
; =============================================================================
; Left pills start at x=78: with their 4px transparent border the visible edge
; is x=82, the left edge of tiled windows (left_padding 76 + window_gap 6).
; Adjacent pills touch, like the horizontal vpn/ethernet bars (8px visible gap).
[bar/top-left]
; mount usage + keyboard layout
inherit = bar/base
width = 267
offset-x = 78
modules-center = filesystem xkeyboard

[bar/top-banner]
inherit = bar/base
width = 380
offset-x = 750
modules-center = banner

[bar/top-volume]
; right before top-music
inherit = bar/base
width = 80
offset-x = 1438
modules-center = volume-compact

[bar/top-music]
; width fits the controls + 32 monospace characters exactly, right edge 1910
inherit = bar/base
width = 392
offset-x = 1518
modules-center = spotify-prev spotify-play-pause spotify-next spotify-fit
; T6: monospace label so label-maxlen is an exact pixel budget
font-5 = Hack Nerd Font:style=Regular:pixelsize=12;1

[bar/bottom-resources]
; same order as the horizontal right bar; width = content at worst-case values
; (memory "99.99 GiB", gpu "99.9GB", cpu "100%", temp "100°C") + 12px each side
inherit = bar/base
width = 320
offset-x = 78
bottom = true
modules-center = memory system-nvidia-smi cpu temperature

[bar/bottom-gearbox]
; same width as the horizontal gearbox bar, right after bottom-resources
inherit = bar/base
width = 4%
offset-x = 398
bottom = true
modules-center = mm712-battery
; T6: small icon, T7: bold percentage (used by mm712_battery.sh)
font-5 = Hack Nerd Font:style=Regular:pixelsize=9;1
font-6 = Hack Nerd Font:style=Bold:pixelsize=9;1

[bar/bottom-vpn]
; same geometry as the horizontal vpn bar
inherit = bar/base
width = 10%
offset-x = 81.5%
bottom = true
modules-center = vpn

[bar/bottom-ethernet]
; same geometry as the horizontal ethernet bar (right edge at 99.5%)
inherit = bar/base
width = 8%
offset-x = 91.5%
bottom = true
modules-center = eth

; =============================================================================
; MODULES - COMPACT (vertical pills)
; =============================================================================
[module/bspwm-desk]
; one desktop icon per slot bar, written by bspwm_desktops_daemon.sh
; click focuses the slot's desktop, scroll cycles desktops of the monitor
type = custom/script
tail = true
scroll-up = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --prev
scroll-down = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --next

[module/bspwm-desk-1]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 1
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 1

[module/bspwm-desk-2]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 2
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 2

[module/bspwm-desk-3]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 3
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 3

[module/bspwm-desk-4]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 4
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 4

[module/bspwm-desk-5]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 5
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 5

[module/bspwm-desk-6]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 6
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 6

[module/bspwm-desk-7]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 7
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 7

[module/bspwm-desk-8]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 8
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 8

[module/bspwm-desk-9]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 9
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 9

[module/bspwm-desk-10]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 10
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 10

[module/date-compact]
; HH:MM, click shows the day/month; white like the volume pill
inherit = module/date
format-padding = 0
format-foreground = ${colors.foreground}
date =
time = "%H:%M"
time-alt = "%d/%m"
label = %time%

[module/spotify-fit]
; "Artist - Title" printed as is (no scrolling) and cut at 32 characters with
; an ellipsis; the monospace font (T6 of top-music) makes that a fixed width
inherit = module/spotify
exec = $HOME/configFiles/polybar/scripts/spotify_status.sh --static
label-maxlen = 32
label-ellipsis = true
label-font = 6

[module/volume-compact]
type = internal/pulseaudio
format-volume = <label-volume>
; %{O6}: the icon is drawn wider than its advance and would touch the number
label-volume = 󰕾%{O6}%percentage%
label-muted = 󰖁
label-muted-foreground = ${colors.foreground-alt}

; vim:ft=dosini
