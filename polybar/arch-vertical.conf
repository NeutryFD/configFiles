; ██╔══██╗██╔═══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔══██╗██╔══██╗
; ██████╔╝██║   ██║██║   ╚████╔╝ ██████╔╝███████║██████╔╝
; ██╔═══╝ ██║   ██║██║    ╚██╔╝  ██╔══██╗██╔══██║██╔══██╗
; ██║     ╚██████╔╝███████╗██║   ██████╔╝██║  ██║██║  ██║
; ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
; Vertical layout: a column of narrow pills on the left edge.
; Selected by bspwmrc when ~/.cache/bar-layout contains "vertical".

; Colors, base bar, modules and settings: arch-common.conf
include-file = arch-common.conf

; =============================================================================
; BASE BAR CONFIG — VERTICAL LEFT BAR
; =============================================================================
; One full-height bar on the left edge (x=8, 60px wide, y=4..1076: the
; visible edges of the top/bottom pills), built from contiguous borderless
; segments with no gaps so it reads as a single rounded bar:
;   top | keyboard | disk | filler | 10 desktop slots (30px,
;   centered on y=540) | filler | hours | minutes | divider | day | month |
;   bottom
; Only the top segment rounds the top corners and the bottom one the bottom
; corners. All segments are named v-desk-* so picom skips their rounding/blur.
; Scrolling anywhere on the bar cycles desktops (bar-level fallback).
; bspwmrc sets left_padding to 8 + 60 + 8 = 76.
; Desktop indicators come from bspwm_desktops_daemon.sh (one bspc subscriber
; for all slots) using T6..T8; T9 is the clock/date font (only those use it),
; T10/T11 the small text fonts of the disk and keyboard segments. Propo: Hack Nerd Font draws icons wider than their
; advance, so polybar clips them.
; Absolute offsets: the desktop monitor is 1920x1080.
; Polybar resolves inherit in alphabetical section order, so the base section
; must sort before the bars inheriting it.
[bar/base-vertical-desk]
inherit = bar/base
; left-edge bars must not reserve space at the top; bspwmrc sets left_padding
enable-struts = false
width = 60
height = 30
offset-x = 8
padding-left = 0
padding-right = 0
module-margin-left = 0
module-margin-right = 0
border-top-size = 0
border-bottom-size = 0
radius = 0
scroll-up = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --prev
scroll-down = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --next
; T6: focused/urgent capsule, T7: occupied capsule (U+23FD), T8: empty dot
font-5 = Hack Nerd Font Propo:style=Bold:pixelsize=21;5
font-6 = Hack Nerd Font Propo:style=Regular:pixelsize=14;3
font-7 = Hack Nerd Font Propo:style=Regular:pixelsize=16;4
; T9: clock digits (only the clock uses it)
font-8 = Droid Sans:style=Regular:pixelsize=15;4
; T10: small text (disk), the bar's regular font
font-9 = fixed:pixelsize=10;3
; T11: T10 raised 1px for lowercase text (keyboard layout) to look centered
font-10 = fixed:pixelsize=10;2
; T12: clock divider line (box drawing, which fixed lacks), offset to center
font-11 = Hack Nerd Font Propo:style=Regular:pixelsize=10;3

; =============================================================================
; BAR DEFINITIONS — VERTICAL LEFT BAR (top to bottom)
; =============================================================================
[bar/v-desk-top]
inherit = bar/base-vertical-desk
offset-y = 4
height = 10
radius-top = 10
modules-center = bspwm-desk-filler

[bar/v-desk-kbd]
; keyboard layout, small regular text
inherit = bar/base-vertical-desk
offset-y = 14
height = 22
modules-center = xkeyboard-compact

[bar/v-desk-disk]
; root disk usage ("/ 44%"), small regular text
inherit = bar/base-vertical-desk
offset-y = 36
height = 22
modules-center = disk-compact

[bar/v-desk-upper]
inherit = bar/base-vertical-desk
offset-y = 58
height = 332
modules-center = bspwm-desk-filler

[bar/v-desk-1]
inherit = bar/base-vertical-desk
offset-y = 390
modules-center = bspwm-desk-1

[bar/v-desk-2]
inherit = bar/base-vertical-desk
offset-y = 420
modules-center = bspwm-desk-2

[bar/v-desk-3]
inherit = bar/base-vertical-desk
offset-y = 450
modules-center = bspwm-desk-3

[bar/v-desk-4]
inherit = bar/base-vertical-desk
offset-y = 480
modules-center = bspwm-desk-4

[bar/v-desk-5]
inherit = bar/base-vertical-desk
offset-y = 510
modules-center = bspwm-desk-5

[bar/v-desk-6]
inherit = bar/base-vertical-desk
offset-y = 540
modules-center = bspwm-desk-6

[bar/v-desk-7]
inherit = bar/base-vertical-desk
offset-y = 570
modules-center = bspwm-desk-7

[bar/v-desk-8]
inherit = bar/base-vertical-desk
offset-y = 600
modules-center = bspwm-desk-8

[bar/v-desk-9]
inherit = bar/base-vertical-desk
offset-y = 630
modules-center = bspwm-desk-9

[bar/v-desk-10]
inherit = bar/base-vertical-desk
offset-y = 660
modules-center = bspwm-desk-10

[bar/v-desk-gap]
inherit = bar/base-vertical-desk
offset-y = 690
height = 252
modules-center = bspwm-desk-filler

[bar/v-desk-hour]
; clock: hours over minutes (white), divider, day over month (accent blue)
inherit = bar/base-vertical-desk
offset-y = 942
height = 24
modules-center = clock-hour

[bar/v-desk-min]
inherit = bar/base-vertical-desk
offset-y = 966
height = 24
modules-center = clock-minute

[bar/v-desk-sep]
; thin muted divider between the time (white) and date (blue) blocks
inherit = bar/base-vertical-desk
offset-y = 990
height = 14
modules-center = clock-divider

[bar/v-desk-day]
inherit = bar/base-vertical-desk
offset-y = 1004
height = 24
modules-center = clock-mday

[bar/v-desk-month]
inherit = bar/base-vertical-desk
offset-y = 1028
height = 24
modules-center = clock-month

[bar/v-desk-bottom]
inherit = bar/base-vertical-desk
offset-y = 1052
height = 24
radius-bottom = 10
modules-center = bspwm-desk-filler

; =============================================================================
; BAR DEFINITIONS — HORIZONTAL CORNER PILLS (same look and struts as arch.conf)
; =============================================================================
; Left pills start at x=78: with their 4px transparent border the visible edge
; is x=82, the left edge of tiled windows (left_padding 76 + window_gap 6).
; The top-left corner is free: disk and keyboard live in the left bar.
; Adjacent pills touch, like the horizontal vpn/ethernet bars (8px visible gap).
[bar/top-banner]
; scrolling banner in a monospace font: 43 cells x 9px = 387px every frame,
; + 12px padding each side + 2x4px border = 420, centered on x=960
inherit = bar/base
width = 420
offset-x = 750
padding-left = 12px
padding-right = 12px
module-margin-left = 0
module-margin-right = 0
modules-center = banner-mono
; T6: Mono variant, every glyph (icons included) is one cell wide
font-5 = Hack Nerd Font Mono:style=Regular:pixelsize=12;1

[bar/top-volume]
; right before top-music
inherit = bar/base
width = 80
offset-x = 1438
modules-center = volume-compact

[bar/top-music]
; width fits the controls + 32 monospace characters exactly, right edge 1910
inherit = bar/base
width = 392
offset-x = 1518
modules-center = spotify-prev spotify-play-pause spotify-next spotify-fit
; T6: monospace label so label-maxlen is an exact pixel budget
font-5 = Hack Nerd Font:style=Regular:pixelsize=12;1

[bar/bottom-resources]
; same order as the horizontal right bar; width = content at worst-case values
; (memory "99.99 GiB", gpu "99.9GB", cpu "100%", temp "100°C") + 12px each side
inherit = bar/base
width = 320
offset-x = 78
bottom = true
modules-center = memory system-nvidia-smi cpu temperature

[bar/bottom-gearbox]
; same width as the horizontal gearbox bar, right after bottom-resources
inherit = bar/base
width = 4%
offset-x = 398
bottom = true
modules-center = mm712-battery
; T6: small icon, T7: bold percentage (used by mm712_battery.sh)
font-5 = Hack Nerd Font:style=Regular:pixelsize=9;1
font-6 = Hack Nerd Font:style=Bold:pixelsize=9;1

[bar/bottom-vpn]
; same geometry as the horizontal vpn bar
inherit = bar/base
width = 10%
offset-x = 81.5%
bottom = true
modules-center = vpn

[bar/bottom-ethernet]
; same geometry as the horizontal ethernet bar (right edge at 99.5%)
inherit = bar/base
width = 8%
offset-x = 91.5%
bottom = true
modules-center = eth

; =============================================================================
; MODULES - COMPACT (vertical pills)
; =============================================================================
[module/bspwm-desk]
; one desktop indicator per slot bar, written by bspwm_desktops_daemon.sh
; click focuses the slot's desktop; scrolling is the bar-level fallback
type = custom/script
tail = true

[module/bspwm-desk-1]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 1
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 1

[module/bspwm-desk-2]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 2
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 2

[module/bspwm-desk-3]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 3
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 3

[module/bspwm-desk-4]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 4
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 4

[module/bspwm-desk-5]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 5
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 5

[module/bspwm-desk-6]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 6
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 6

[module/bspwm-desk-7]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 7
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 7

[module/bspwm-desk-8]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 8
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 8

[module/bspwm-desk-9]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 9
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 9

[module/bspwm-desk-10]
inherit = module/bspwm-desk
exec = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --follow 10
click-left = $HOME/configFiles/polybar/scripts/bspwm_desktops_daemon.sh --focus 10

[module/bspwm-desk-filler]
; nothing to show: polybar needs a module in every bar
type = custom/text
format = " "

[module/clock-hour]
; hours of the stacked clock and date (T9 of base-vertical-desk)
inherit = module/date
format-padding = 0
format-foreground = ${colors.foreground}
date =
time = "%H"
label = %time%
label-font = 9

[module/disk-compact]
; root usage only (no /NFS-Vault in vertical mode): "/ 44%"
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %mountpoint% %percentage_used%%
label-mounted-font = 10
label-unmounted = %mountpoint% --
label-unmounted-font = 10

[module/xkeyboard-compact]
inherit = module/xkeyboard
label-layout-font = 11

[module/clock-minute]
inherit = module/clock-hour
time = "%M"

[module/clock-mday]
; named to sort after clock-hour: polybar resolves inherit alphabetically
; date digits in the accent blue so they read apart from the white time
inherit = module/clock-hour
time = "%d"
format-foreground = #7aa2f7

[module/clock-month]
inherit = module/clock-hour
time = "%m"
format-foreground = #7aa2f7

[module/clock-divider]
; ~18px thin line (box drawing) in T12, muted
type = custom/text
format = "%{T12}%{F#6b6880}──%{F-}%{T-}"

[module/banner-mono]
; the same scrolling banner (43-character window of banner.sh's marquee) in the
; monospace T6 of top-banner, so every frame has the same width
inherit = module/banner
label-padding = 0
label-font = 6

[module/spotify-fit]
; "Artist - Title" printed as is (no scrolling) and cut at 32 characters with
; an ellipsis; the monospace font (T6 of top-music) makes that a fixed width
inherit = module/spotify
exec = $HOME/configFiles/polybar/scripts/spotify_status.sh --static
label-maxlen = 32
label-ellipsis = true
label-font = 6

[module/volume-compact]
type = internal/pulseaudio
format-volume = <label-volume>
; %{O6}: the icon is drawn wider than its advance and would touch the number
label-volume = 󰕾%{O6}%percentage%
label-muted = 󰖁
label-muted-foreground = ${colors.foreground-alt}

; vim:ft=dosini
