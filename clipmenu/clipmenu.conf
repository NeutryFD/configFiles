# clipmenu.conf - see `man clipmenu.conf`
# Requires clipmenu built from upstream develop after 2025-05-28 (touch_on_select)

# Move a clip to the top of the list when it is picked in clipmenu,
# so the menu is ordered by last used instead of last copied
touch_on_select 1

# Keep only the newest copy of repeated clips, so a re-copied clip moves up
# instead of appearing twice
deduplicate 1
