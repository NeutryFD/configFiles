include-file = ~/.config/polybar/colors.conf

; =============================================================================
; BASE BAR CONFIG
; =============================================================================
[bar/base]
override-redirect = true
wm-restack = bspwm
enable-ipc = true
monitor = ${env:MONITOR:}
radius = 6.0
height = 35
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3
line-color = ${colors.line}
border-size = 4
border-color = ${colors.transparent}
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 2
dpi = 96
font-0 = fixed:pixelsize=12;1
font-1 = unifont:fontformat=truetype:pixelsize=12:antialias=true;1
font-2 = siji:pixelsize=12;1
font-3 = MaterialIcons-Regular:style=Bold:pixelsize=13;1
font-4 = Hack Nerd Font:style=Bold:pixelsize=12;1
cursor-click = pointer
cursor-scroll = ns-resize

; =============================================================================
; BASE BAR CONFIG — EXTERNAL MONITORS (smaller fonts)
; =============================================================================
[bar/base-ext]
inherit = bar/base
height = 27
font-0 = fixed:pixelsize=10;1
font-1 = unifont:fontformat=truetype:pixelsize=10:antialias=true;1
font-2 = siji:pixelsize=10;1
font-3 = MaterialIcons-Regular:style=Bold:pixelsize=11;1
font-4 = Hack Nerd Font:style=Bold:pixelsize=10;1

; =============================================================================
; BAR DEFINITIONS — INTERNAL (LAPTOP SCREEN)
; =============================================================================
[bar/thinkpad-left]
inherit = bar/base
width = 14%
offset-x = 0.8%
modules-center = xkeyboard battery filesystem

[bar/thinkpad-banner]
inherit = bar/base
width = 18%
offset-x = 14.5%
modules-center = banner

[bar/thinkpad-vpn]
inherit = bar/base
width = 12%
offset-x = 69.5%
bottom = true
modules-center = vpn

[bar/thinkpad-bspwm]
inherit = bar/base
width = 17%
offset-x = 40%
modules-center = bspwm

[bar/thinkpad-music]
inherit = bar/base
width = 10%
offset-x = 61.5%
modules-center = spotify

[bar/thinkpad-wifi]
inherit = bar/base
width = 9%
offset-x = 81.5%
bottom = true
modules-center = wlan

[bar/thinkpad-ethernet]
inherit = bar/base
width = 9%
offset-x = 90.3%
bottom = true
modules-center = eth

[bar/thinkpad-right]
inherit = bar/base
width = 28%
offset-x = 71.3%
modules-center = spotify-prev spotify-play-pause spotify-next alsa memory cpu temperature date

[bar/thinkpad-gearbox]
inherit = bar/base
width = 5%
offset-x = 0.8%
bottom = true
modules-center = mm712-battery
font-5 = Hack Nerd Font:style=Regular:pixelsize=9;1
font-6 = Hack Nerd Font:style=Bold:pixelsize=9;1

; =============================================================================
; BAR DEFINITIONS — EXTERNAL MONITORS
; =============================================================================
[bar/thinkpad-ext-banner]
inherit = bar/base-ext
width = 16%
offset-x = 0.8%
modules-left = banner

[bar/thinkpad-ext-vpn]
inherit = bar/base-ext
width = 10%
offset-x = 17%
modules-center = vpn

[bar/thinkpad-ext-bspwm]
inherit = bar/base-ext
width = 7%
offset-x = 46.5%
modules-center = bspwm

[bar/thinkpad-ext-music]
inherit = bar/base-ext
width = 10%
offset-x = 73%
modules-center = spotify

[bar/thinkpad-ext-right]
inherit = bar/base-ext
width = 16.5%
offset-x = 82.8%
modules-right = spotify-prev spotify-play-pause spotify-next volume date

; =============================================================================
; MODULES - SYSTEM
; =============================================================================
[module/xkeyboard]
; font-0 (fixed) — plain text layout label
type = internal/xkeyboard
blacklist-0 = num lock
format-prefix-foreground = ${colors.foreground-alt}
label-layout = %layout%
label-indicator-padding = 5
label-indicator-margin = 1
label-indicator-background = ${colors.secondary}
label-indicator-underline = ${colors.secondary}

[module/battery]
; font-2 (siji) — ramp/animation charging icons
type = internal/battery
full-at = 99
low-at = 5
battery = BAT0
adapter = ADP1
poll-interval = 5
time-format = %H:%M
format-charging = <animation-charging>    <label-charging>
format-discharging = <ramp-capacity>   <label-discharging>
label-charging = Charging %percentage%%
label-discharging = Discharging %percentage%%
label-full = Fully charged
label-low = BATTERY LOW

; animation options for battery module
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

; Only applies if <bar-capacity> is used
bar-capacity-width = 10

; Only applies if <animation-charging> is used
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
; Framerate in milliseconds
animation-charging-framerate = 750

; Only applies if <animation-discharging> is used
animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
; Framerate in milliseconds
animation-discharging-framerate = 500

; Only applies if <animation-low> is used
; New in version 3.6.0
animation-low-0 = !
animation-low-1 = 
animation-low-framerate = 200

[module/filesystem]
; font-0 (fixed) — plain text mount label
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %mountpoint%: %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.foreground-alt}

[module/memory]
; font-4 (HackNerdFont) — RAM icon (patched as raw bytes)
type = internal/memory
interval = 3
warn-percentage = 95
format = <label>
label =    %gb_used%

[module/cpu]
; font-4 (HackNerdFont) — CPU icon (patched as raw bytes)
type = internal/cpu
format = <label>
format-prefix ="   :"
label = %percentage%%

[module/temperature]
; font-0 (fixed) — plain text
type = internal/temperature
thermal-zone = 0
warn-temperature = 60

[module/date]
; font-0 (fixed) — plain text date/time
type = internal/date
interval = 1
date = "%d-%m-%Y"
time = "%H:%M:%S"
format-padding = 1
format-prefix-foreground = ${colors.date}
format-foreground = ${colors.date}
label = %date% %time%

[module/volume]
; font-0 (fixed) — plain text script output
type = custom/script
exec = $HOME/.config/polybar/scripts/volume.sh
interval = 0
format = <label>
label = %output%

[module/eth]
; font-4 (HackNerdFont) — coloured 󰈀 󰈂 icons, like the arch bars
; %{O6}: the icon overhangs its advance; the space matches vpn-nmcli.sh --icons
type = internal/network
interface = enp1s0
interval = 3.0
format-connected-prefix = "󰈀%{O6} "
format-connected-prefix-foreground = ${colors.ok}
label-connected = %local_ip%
format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰈂%{O6} "
format-disconnected-prefix-foreground = ${colors.alert}
label-disconnected = offline
label-disconnected-foreground = ${colors.alert}

[module/wlan]
; font-4 (HackNerdFont) — coloured 󰖩 󰖪 icons
; must sort after eth (inherit order)
inherit = module/eth
interface = wlp2s0
format-connected-prefix = "󰖩%{O6} "
format-disconnected-prefix = "󰖪%{O6} "

; =============================================================================
; MODULES - BSPWM
; =============================================================================
[module/bspwm]
; font-4 (HackNerdFont) — 󰮯 󰊠 󰧵 workspace icons
type = internal/bspwm
format-padding = 2
label-focused = " 󰮯 "
label-focused-background = ${colors.background}
label-focused-underline = ${colors.primary}
label-focused-padding = 1
label-focused-foreground = ${colors.desk-focused}
label-occupied = " 󰊠 "
label-occupied-foreground = ${colors.desk-occupied}
label-occupied-padding = 1
label-urgent = %index%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = " 󰧵 "
label-empty-foreground = ${colors.desk-empty}
label-empty-padding = 1

; =============================================================================
; MODULES - SPOTIFY
; =============================================================================
[module/spotify]
; font-0 (fixed) — plain text title; prefix space only
type = custom/script
tail = true
interval = 0
format-prefix = " "
format = <label>
; scrolls only titles longer than label-maxlen
exec = $HOME/.config/polybar/scripts/spotify_status.sh --fit 20
label-padding = 1
label-maxlen = 20
label-ellipsis = false

[module/spotify-prev]
; font-4 (HackNerdFont) — 󰙣 icon
type = custom/script
exec = echo "󰙣 "
format = <label>
click-left = playerctl previous -p spotify

[module/spotify-play-pause]
; font-4 (HackNerdFont) — 󰏤 / 󰐌 icons
type = custom/ipc
hook-1 = echo "󰏤 "
hook-0 = echo "󰐌 "
initial = 0
click-left = playerctl play-pause -p spotify

[module/spotify-next]
; font-4 (HackNerdFont) — 󰙡 icon
type = custom/script
exec = echo "󰙡 "
format = <label>
click-left = playerctl next -p spotify

; =============================================================================
; MODULES - CUSTOM
; =============================================================================
[module/banner]
; font-0 (fixed) — plain text script output
type = custom/script
exec = $HOME/.config/polybar/scripts/banner.sh
interval = 0
tail = true
format = <label>
label-padding = 1
label-maxlen = 43
label-ellipsis = false

[module/vpn]
; font-4 (HackNerdFont) — coloured icon from the script, like the arch bars
type = custom/script
interval = 3
exec = $HOME/.config/polybar/scripts/vpn-nmcli.sh --icons
format = <label>
label = %output%

[module/mm712-battery]
; font-5 (small icon) and font-6 (bold percentage), defined in [bar/thinkpad-gearbox]
type = custom/script
exec = $HOME/.config/polybar/scripts/mm712_battery.sh --tail
tail = true
; left: full status, right: refresh now
click-left = $HOME/.config/polybar/scripts/mm712_battery.sh --status &
click-right = kill -USR1 %pid%

; =============================================================================
; SETTINGS
; =============================================================================
[settings]
screenchange-reload = true

[global/wm]
margin-top = 5
margin-bottom = 5

; vim:ft=dosini
