; bar/base and the modules come from thinkpad.conf, the left bar from vertical.conf
include-file = thinkpad.conf
include-file = ~/.config/polybar/vertical.conf

; =============================================================================
; BAR DEFINITIONS — TOP/BOTTOM PILLS
; =============================================================================
; Same height as the left bar segments
[bar/base-pill]
inherit = bar/base
height = 30

[bar/top-battery]
inherit = bar/base-pill
width = 120
offset-x = 68
modules-center = battery-compact

[bar/top-gearbox]
inherit = bar/base-pill
width = 80
offset-x = 196
modules-center = mm712-battery
; T6/T7 are used by mm712_battery.sh
font-5 = Hack Nerd Font:style=Regular:pixelsize=9;1
font-6 = Hack Nerd Font:style=Bold:pixelsize=9;1

[bar/top-privacy]
inherit = bar/base-pill
width = 70
offset-x = 284
modules-center = privacy

[bar/top-banner]
inherit = bar/base-pill
width = 420
offset-x = 50%:-210
padding-left = 12px
padding-right = 12px
module-margin-left = 0
module-margin-right = 0
modules-center = banner-mono
; monospace: constant marquee width
font-5 = Hack Nerd Font Mono:style=Regular:pixelsize=12;1

[bar/top-volume]
inherit = bar/base-pill
width = 80
offset-x = 100%:-482
modules-center = volume-compact

[bar/top-music]
inherit = bar/base-pill
width = 392
offset-x = 100%:-402
modules-center = spotify-prev spotify-play-pause spotify-next spotify-fit
; monospace: label-maxlen is an exact width
font-5 = Hack Nerd Font:style=Regular:pixelsize=12;1

[bar/bottom-resources]
inherit = bar/base-pill
width = 280
offset-x = 68
bottom = true
modules-center = memory cpu temperature

[bar/bottom-vpn]
inherit = bar/base-pill
width = 8%
offset-x = 73.5%
bottom = true
modules-center = vpn

[bar/bottom-wifi]
inherit = bar/base-pill
width = 9%
offset-x = 81.5%
bottom = true
modules-center = wlan

[bar/bottom-ethernet]
inherit = bar/base-pill
width = 9%
offset-x = 90.5%
bottom = true
modules-center = eth

; =============================================================================
; MODULES
; =============================================================================
[module/battery-compact]
inherit = module/battery
format-charging = <animation-charging>  <label-charging>
format-discharging = <ramp-capacity>  <label-discharging>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 100%
label-low = LOW %percentage%%

; vim:ft=dosini
