; Colors, base bar, modules and settings: arch-common.conf
include-file = arch-common.conf

; =============================================================================
; BAR DEFINITIONS
; =============================================================================
; Same layout as the thinkpad horizontal bars (hosts/thinkpad/polybar/thinkpad.conf)
; Neighbouring pills touch (offset = previous offset + width): the 5px transparent
; borders leave the same 10px gap between all of them, 0.5% margin at the screen edges

; Top, left to right: workspaces, gearbox, privacy | banner (centre) | volume, music
[bar/bspwm]
inherit = bar/base
width = ${env:BSPWM_PILL_WIDTH:315}
offset-x = 5
modules-center = bspwm

[bar/gearbox]
inherit = bar/base
width = 107
offset-x = ${env:GEARBOX_X:320}
modules-center = mm712-battery
; T6: small icon, T7: bold percentage (used by mm712_battery.sh)
font-5 = Hack Nerd Font:style=Regular:pixelsize=12;1
font-6 = Hack Nerd Font:style=Bold:pixelsize=12;1

[bar/privacy]
inherit = bar/base
width = 93
offset-x = ${env:PRIVACY_X:427}
modules-center = privacy

[bar/banner]
inherit = bar/base
width = 469
offset-x = 50%:-235
modules-center = banner

; Volume and music in pixels from the right edge, as in arch-vertical.conf:
; dunst stacks notifications in the gap just left of the volume (config/dunst/dunstrc)
[bar/volume]
inherit = bar/base
width = 107
offset-x = 100%:-635
modules-center = volume-icon

[bar/music]
inherit = bar/base
width = 523
offset-x = 100%:-528
modules-center = spotify-prev spotify-play-pause spotify-next spotify-wide

; Bottom left: keyboard and storage, sensors
[bar/left]
inherit = bar/base
width = 182
offset-x = 5
bottom = true
modules-center = xkeyboard filesystem

[bar/status]
inherit = bar/base
width = 437
offset-x = 187
bottom = true
modules-center = memory system-nvidia-smi cpu temperature

; Bottom centre: clock
[bar/clock]
inherit = bar/base
width = 197
offset-x = 50%:-99
bottom = true
modules-center = date-short date-short-divider date-short-time

; Bottom right: network
[bar/tunnels]
inherit = bar/base
width = 205
offset-x = 100%:-416
bottom = true
modules-center = tunnels

[bar/vpn]
inherit = bar/base
width = 256
offset-x = 100%:-672
bottom = true
modules-center = vpn

[bar/ethernet]
inherit = bar/base
width = 206
offset-x = 100%:-211
bottom = true
modules-center = eth

; vim:ft=dosini
