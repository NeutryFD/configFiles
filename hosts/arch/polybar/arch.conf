; Colors, base bar, modules and settings: arch-common.conf
include-file = arch-common.conf

; =============================================================================
; BAR DEFINITIONS
; =============================================================================
; Same layout as the thinkpad horizontal bars (hosts/thinkpad/polybar/thinkpad.conf)
; Neighbouring pills touch (offset = previous offset + width): the 4px transparent
; borders leave the same 8px gap between all of them, 0.5% margin at the screen edges

; Top, left to right: workspaces, gearbox, privacy | banner (centre) | volume, music
[bar/bspwm]
inherit = bar/base
width = ${env:BSPWM_PILL_WIDTH:236}
offset-x = 4
modules-center = bspwm

[bar/gearbox]
inherit = bar/base
width = 80
offset-x = ${env:GEARBOX_X:240}
modules-center = mm712-battery
; T6: small icon, T7: bold percentage (used by mm712_battery.sh)
font-5 = Hack Nerd Font:style=Regular:pixelsize=9;1
font-6 = Hack Nerd Font:style=Bold:pixelsize=9;1

[bar/privacy]
inherit = bar/base
width = 70
offset-x = ${env:PRIVACY_X:320}
modules-center = privacy

[bar/banner]
inherit = bar/base
width = 352
offset-x = 50%:-176
modules-center = banner

; Volume and music in pixels from the right edge, as in arch-vertical.conf:
; dunst stacks notifications in the gap just left of the volume (config/dunst/dunstrc)
[bar/volume]
inherit = bar/base
width = 80
offset-x = 100%:-476
modules-center = volume-icon

[bar/music]
inherit = bar/base
width = 392
offset-x = 100%:-396
modules-center = spotify-prev spotify-play-pause spotify-next spotify-wide

; Bottom left: keyboard and storage, sensors
[bar/left]
inherit = bar/base
width = 136
offset-x = 4
bottom = true
modules-center = xkeyboard filesystem

[bar/status]
inherit = bar/base
width = 328
offset-x = 140
bottom = true
modules-center = memory system-nvidia-smi cpu temperature

; Bottom centre: clock
[bar/clock]
inherit = bar/base
width = 148
offset-x = 50%:-74
bottom = true
modules-center = date-short date-short-divider date-short-time

; Bottom right: network
[bar/tunnels]
inherit = bar/base
width = 154
offset-x = 100%:-312
bottom = true
modules-center = tunnels

[bar/vpn]
inherit = bar/base
width = 192
offset-x = 100%:-504
bottom = true
modules-center = vpn

[bar/ethernet]
inherit = bar/base
width = 154
offset-x = 100%:-158
bottom = true
modules-center = eth

; vim:ft=dosini
