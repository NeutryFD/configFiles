include-file = arch-common.conf
include-file = ~/.config/polybar/vertical.conf

; =============================================================================
; BAR DEFINITIONS — TOP/BOTTOM PILLS
; =============================================================================
[bar/top-gearbox]
inherit = bar/base
width = 80
offset-x = 68
modules-center = mm712-battery
; T6/T7 are used by mm712_battery.sh
font-5 = Hack Nerd Font:style=Regular:pixelsize=9;1
font-6 = Hack Nerd Font:style=Bold:pixelsize=9;1

; right of top-gearbox (68 + 4%) with the same 8px gap
[bar/top-privacy]
inherit = bar/base
width = 70
offset-x = 148
modules-center = privacy

[bar/top-banner]
inherit = bar/base
width = 420
offset-x = 50%:-210
modules-center = banner-mono
; monospace: constant marquee width
font-5 = Hack Nerd Font Mono:style=Regular:pixelsize=12;1

[bar/top-volume]
inherit = bar/base
width = 80
offset-x = 100%:-476
modules-center = volume-compact

[bar/top-music]
inherit = bar/base
width = 392
offset-x = 100%:-396
modules-center = spotify-prev spotify-play-pause spotify-next spotify-fit
; monospace: label-maxlen is an exact width
font-5 = Hack Nerd Font:style=Regular:pixelsize=12;1

[bar/bottom-resources]
inherit = bar/base
width = 320
offset-x = 68
bottom = true
modules-center = memory system-nvidia-smi cpu temperature

[bar/bottom-tunnels]
inherit = bar/base
width = 154
offset-x = 100%:-312
bottom = true
modules-center = tunnels

[bar/bottom-vpn]
inherit = bar/base
width = 192
offset-x = 100%:-504
bottom = true
modules-center = vpn

[bar/bottom-ethernet]
inherit = bar/base
width = 154
offset-x = 100%:-158
bottom = true
modules-center = eth

; vim:ft=dosini
