include-file = arch-common.conf
include-file = ~/.config/polybar/vertical.conf

; =============================================================================
; BAR DEFINITIONS — TOP/BOTTOM PILLS
; =============================================================================
[bar/top-gearbox]
inherit = bar/base
width = 107
offset-x = 91
modules-center = mm712-battery
; T6/T7 are used by mm712_battery.sh
font-5 = Hack Nerd Font:style=Regular:pixelsize=12;1
font-6 = Hack Nerd Font:style=Bold:pixelsize=12;1

; right of top-gearbox (91 + 107) with the same 10px gap
[bar/top-privacy]
inherit = bar/base
width = 93
offset-x = 198
modules-center = privacy

[bar/top-banner]
inherit = bar/base
width = 560
offset-x = 50%:-280
modules-center = banner-mono
; monospace: constant marquee width
font-5 = Hack Nerd Font Mono:style=Regular:pixelsize=16;1

[bar/top-volume]
inherit = bar/base
width = 107
offset-x = 100%:-635
modules-center = volume-compact-wide

[bar/top-music]
inherit = bar/base
width = 523
offset-x = 100%:-528
modules-center = spotify-prev spotify-play-pause spotify-next spotify-fit
; monospace: label-maxlen is an exact width
font-5 = Hack Nerd Font:style=Regular:pixelsize=16;1

[bar/bottom-resources]
inherit = bar/base
width = 427
offset-x = 91
bottom = true
modules-center = memory system-nvidia-smi cpu temperature

[bar/bottom-tunnels]
inherit = bar/base
width = 205
offset-x = 100%:-416
bottom = true
modules-center = tunnels

[bar/bottom-vpn]
inherit = bar/base
width = 256
offset-x = 100%:-672
bottom = true
modules-center = vpn

[bar/bottom-ethernet]
inherit = bar/base
width = 206
offset-x = 100%:-211
bottom = true
modules-center = eth

; =============================================================================
; MODULES
; =============================================================================
[module/volume-compact-wide]
; volume-compact with the offset scaled; must sort after volume-compact (inherit order)
inherit = module/volume-compact
label-volume = 󰕾%{O8}%percentage%

; vim:ft=dosini
