; Shared by arch.conf and arch-vertical.conf

include-file = ~/.config/polybar/colors.conf

; =============================================================================
; BASE BAR CONFIG
; =============================================================================
[bar/base]
override-redirect = true
wm-restack = bspwm
enable-ipc = true
radius = 6.0
height = 30
; 4 + the 4px transparent border = 8px from the screen edge, like the gaps between bars
offset-y = 4
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3
line-color = ${colors.line}
border-size = 4
border-color = ${colors.transparent}
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 2
dpi = 96
font-0 = fixed:pixelsize=12;1
font-1 = unifont:fontformat=truetype:pixelsize=12:antialias=true;1
font-2 = siji:pixelsize=12;1
font-3 = MaterialIcons-Regular:style=Bold:pixelsize=13;1
font-4 = Hack Nerd Font:style=Bold:pixelsize=12;1
cursor-click = pointer
cursor-scroll = ns-resize

; =============================================================================
; MODULES - SYSTEM
; =============================================================================
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
format-prefix-foreground = ${colors.foreground-alt}
label-layout = %layout%
label-indicator-padding = 5
label-indicator-margin = 1
label-indicator-background = ${colors.secondary}
label-indicator-underline = ${colors.secondary}

[module/filesystem]
type = internal/fs
interval = 10
mount-0 = /
label-mounted = %mountpoint%: %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.foreground-alt}

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 95
format = <label>
label =    %gb_used%

[module/cpu]
type = internal/cpu
format = <label>
format-prefix ="   :"
label = %percentage%%

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 60

[module/date]
type = internal/date
interval = 1
date = "%d-%m-%Y"
time = "%H:%M:%S"
format-padding = 1
format-prefix-foreground = ${colors.date}
format-foreground = ${colors.date}
label = %date% %time%

[module/date-short]
; date | time, coloured like the vertical clock; must sort after date (inherit order)
inherit = module/date
format-padding = 0
format-foreground = ${colors.accent}
date = "%d/%m"
time =
label = %date%

[module/date-short-divider]
type = custom/text
format = |
format-foreground = ${colors.muted}

[module/date-short-time]
inherit = module/date-short
format-foreground = ${colors.foreground}
date =
time = "%H:%M"
label = %time%

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 0
format = <label>
label = %output%

[module/volume-icon]
; the icon overhangs its advance
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = 󰕾%{O6} %percentage%%
label-muted = 󰖁
label-muted-foreground = ${colors.foreground-alt}

[module/eth]
type = internal/network
interface = enp5s0
interval = 3.0
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.ok}
label-connected = %local_ip%
format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰈂 "
format-disconnected-prefix-foreground = ${colors.alert}
label-disconnected = offline
label-disconnected-foreground = ${colors.alert}

[module/system-nvidia-smi]
type = custom/script
exec = $HOME/.config/polybar/scripts/usage_gpu.sh
interval = 2

; =============================================================================
; MODULES - BSPWM
; =============================================================================
[module/bspwm]
type = internal/bspwm
format-padding = 2
label-focused = " 󰮯 "
label-focused-background = ${colors.background}
label-focused-underline = ${colors.primary}
label-focused-padding = 1
label-focused-foreground = ${colors.desk-focused}
label-occupied = " 󰊠 "
label-occupied-foreground = ${colors.desk-occupied}
label-occupied-padding = 1
label-urgent = %index%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = " 󰧵 "
label-empty-foreground = ${colors.desk-empty}
label-empty-padding = 1

[module/bspwm-capsules]
; module/bspwm on the portrait monitor, so the Pac-Man desktops look the same on both
inherit = module/bspwm
pin-workspaces = true

[bar/second-bspwm]
inherit = bar/base
monitor = ${env:MONITOR:}
bottom = true
width = 92
height = 38
offset-x = 50%:-46
radius = 10
modules-center = bspwm-capsules

[module/bspwm-lines]
; Blue desktop lines for the portrait monitor in the vertical layout
type = internal/bspwm
pin-workspaces = true
label-focused = 
label-focused-font = 6
label-focused-foreground = ${colors.accent}
label-focused-padding = 1
label-occupied = 
label-occupied-font = 7
label-occupied-foreground = ${colors.muted}
label-occupied-padding = 1
label-urgent = 
label-urgent-font = 6
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1
label-empty = •
label-empty-font = 8
label-empty-foreground = ${colors.subtle}
label-empty-padding = 1

[bar/second-bspwm-lines]
inherit = bar/base
monitor = ${env:MONITOR:}
bottom = true
width = 100%:-8
height = 38
offset-x = 4
radius = 10
modules-center = bspwm-lines
font-5 = Hack Nerd Font Propo:style=Bold:pixelsize=32;9
font-6 = Hack Nerd Font Propo:style=Bold:pixelsize=22;6
font-7 = Hack Nerd Font Propo:style=Regular:pixelsize=16;4

; =============================================================================
; MODULES - SPOTIFY
; =============================================================================
[module/spotify]
type = custom/script
tail = true
interval = 0
format-prefix = " "
format = <label>
exec = ~/.config/polybar/scripts/spotify_status.sh
label-padding = 1
label-maxlen = 20
label-ellipsis = false

[module/spotify-wide]
; horizontal music pill; must sort after spotify (inherit order)
inherit = module/spotify
exec = ~/.config/polybar/scripts/spotify_status.sh --fit 32
label-maxlen = 32

[module/spotify-prev]
type = custom/script
exec = echo "󰙣 "
format = <label>
click-left = playerctl previous -p playerctld

[module/spotify-play-pause]
type = custom/ipc
hook-1 = echo "󰏤 "
hook-0 = echo "󰐌 "
initial = 0
click-left = playerctl play-pause -p playerctld

[module/spotify-next]
type = custom/script
exec = echo "󰙡 "
format = <label>
click-left = playerctl next -p playerctld

; =============================================================================
; MODULES - CUSTOM
; =============================================================================
[module/banner]
type = custom/script
exec = $HOME/.config/polybar/scripts/banner.sh
interval = 0
tail = true
format = <label>
label-padding = 1
label-maxlen = 43
label-ellipsis = false

[module/vpn]
type = custom/script
interval = 3
exec = $HOME/.config/polybar/scripts/vpn-status.sh
click-left = $HOME/.config/polybar/scripts/vpn-status.sh --status &
format = <label>
label = %output%

[module/tunnels]
type = custom/script
interval = 3
exec = $HOME/.config/polybar/scripts/vpn-status.sh --tunnels
click-left = $HOME/.config/polybar/scripts/vpn-status.sh --status &
format = <label>
label = %output%

[module/privacy]
; mic and camera icons, red while in use; left: notification with the apps using them
type = custom/script
exec = $HOME/.config/polybar/scripts/privacy.sh
tail = true
click-left = $HOME/.config/polybar/scripts/privacy.sh --notify &

[module/mm712-battery]
type = custom/script
exec = $HOME/.config/polybar/scripts/mm712_battery.sh --tail
tail = true
; left: full status, right: refresh now
click-left = $HOME/.config/polybar/scripts/mm712_battery.sh --status &
click-right = kill -USR1 %pid%

[module/tray]
type = internal/tray
format-margin = 2px
tray-spacing = 2px

; =============================================================================
; SETTINGS
; =============================================================================
[settings]
screenchange-reload = true

[global/wm]
margin-top = 5
margin-bottom = 5

; vim:ft=dosini
